<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Old Gods of Atlanta - Dice Tray: Roll 3D dice (d6, d20, d100) with click or swipe gestures. A browser-based dice roller for tabletop gaming.">
  <meta name="theme-color" content="#000000">
  <title>Old Gods of Atlanta - Dice Tray</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <main class="app-container">
    <div class="controls-panel">
      <span class="dice-type-selector">
        <button class="type-btn active" data-type="1d6">d6</button>
        <button class="type-btn" data-type="1d20">d20</button>
        <button class="type-btn" data-type="1d100">d100</button>
        <button id="launch-theme-picker">⭐</button>
      </span>
    </div>

    <div class="canvas-container" id="dice-box" aria-live="polite" aria-atomic="true" role="region" aria-label="Dice roll results"></div>

  </main>

  <script type="module" src="dice.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then((registration) => {
          console.log('ServiceWorker registered:', registration.scope);
        })
        .catch((error) => {
          console.log('ServiceWorker registration failed:', error);
        });
    }
  </script>
</body>
</html>
